<div class="signup-container">
  <div class="signup-card">
    <h2 class="signup-title">Create Account</h2>
    
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="displayName">Full Name</label>
        <input
          type="text"
          id="displayName"
          class="form-control"
          formControlName="displayName"
          placeholder="Enter your full name"
          [class.is-invalid]="submitted && f['displayName'].errors"
        />
        <div *ngIf="submitted && f['displayName'].errors" class="invalid-feedback">
          <span *ngIf="f['displayName'].errors['required']">Full name is required</span>
          <span *ngIf="f['displayName'].errors['minlength']">Name must be at least 2 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter your email"
          [class.is-invalid]="submitted && f['email'].errors"
        />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Invalid email format</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
            [class.is-invalid]="submitted && f['password'].errors"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            {{ hidePassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-input-group">
          <input
            [type]="hideConfirmPassword ? 'password' : 'text'"
            id="confirmPassword"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Confirm your password"
            [class.is-invalid]="submitted && (f['confirmPassword'].errors || signupForm.errors?.['passwordMismatch'])"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="toggleConfirmPasswordVisibility()"
            tabindex="-1"
          >
            {{ hideConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
          <span *ngIf="f['confirmPassword'].errors['required']">Please confirm your password</span>
        </div>
        <div *ngIf="submitted && signupForm.errors?.['passwordMismatch']" class="invalid-feedback">
          Passwords do not match
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading"
      >
        {{ loading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a routerLink="/login">Login</a>
    </div>

    <div class="login-id-link">
      Login with ID? <a routerLink="/login-id">Use User ID</a>
    </div>
  </div>
</div>

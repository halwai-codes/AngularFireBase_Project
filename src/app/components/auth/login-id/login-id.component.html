<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Login with ID</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="userId">User ID</label>
        <input
          type="text"
          id="userId"
          class="form-control"
          formControlName="userId"
          placeholder="Enter your user ID"
          [class.is-invalid]="submitted && f['userId'].errors"
        />
        <div *ngIf="submitted && f['userId'].errors" class="invalid-feedback">
          <span *ngIf="f['userId'].errors['required']">User ID is required</span>
          <span *ngIf="f['userId'].errors['minlength']">User ID must be at least 3 characters</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
            [class.is-invalid]="submitted && f['password'].errors"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            {{ hidePassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div class="demo-section">
      <h4>Demo Credentials:</h4>
      <div class="demo-buttons">
        <button
          type="button"
          class="demo-btn"
          *ngFor="let user of demoUsers"
          (click)="fillDemoCredentials(user.userId)"
        >
          {{ user.userId }}
        </button>
      </div>
    </div>

    <div class="links">
      <a routerLink="/login">Login with Email</a>
      <span class="separator">•</span>
      <a routerLink="/signup">Create Account</a>
    </div>
  </div>
</div>
